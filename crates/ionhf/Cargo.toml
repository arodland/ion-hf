[package]
name = "ionhf"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = "0.4.45"
cpal = "0.15.3"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "default_fonts", "clipboard", "persistence", "wayland", "x11"] }
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ion = { path = "../ion" }
ion-dsp = { path = "../ion-dsp" }
log = "0.4.34"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
# No libudev: only opening ports by name is needed.
serialport = { version = "4", default-features = false }
tci = { path = "../tci" }
toml = "1.1.8"

[build-dependencies]
winresource = "0.1.34"
