name: Release

# A `v*` tag builds Windows, macOS, Linux and Debian packages and publishes
# them as a GitHub Release (a pre-release when the version has a suffix
# such as `-alpha.1`). Run by hand, it builds the same packages as run
# artifacts and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(grep -m1 '^version' crates/ionhf/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/ionhf version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      NAME: IonHF-${{ needs.version.outputs.version }}-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ion --release --lib
      - run: cargo build -p ionhf --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/$env:NAME" | Out-Null
          Copy-Item target/release/ionhf.exe "dist/$env:NAME/"
          Copy-Item packaging/README.txt, LICENSE, NOTICE "dist/$env:NAME/"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/$env:NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/${{ env.NAME }}.zip

  macos:
    needs: version
    runs-on: macos-latest
    env:
      NAME: IonHF-${{ needs.version.outputs.version }}-macos
      NUMERIC: ${{ needs.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ion --release --lib
      - run: cargo build -p ionhf --release --target aarch64-apple-darwin
      - run: cargo build -p ionhf --release --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          APP="dist/root/Ion HF.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/ionhf" \
            target/aarch64-apple-darwin/release/ionhf \
            target/x86_64-apple-darwin/release/ionhf
          lipo -info "$APP/Contents/MacOS/ionhf"
          mkdir -p dist/ion.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s crates/ionhf/assets/icon.png --out dist/ion.iconset/icon_${s}x${s}.png > /dev/null
          done
          for s in 16 32 64 128; do
            cp dist/ion.iconset/icon_$((s * 2))x$((s * 2)).png dist/ion.iconset/icon_${s}x${s}@2x.png
          done
          rm -f dist/ion.iconset/icon_64x64.png
          iconutil -c icns dist/ion.iconset -o "$APP/Contents/Resources/ion.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Ion HF</string>
            <key>CFBundleDisplayName</key><string>Ion HF</string>
            <key>CFBundleIdentifier</key><string>net.forkum.ionhf</string>
            <key>CFBundleExecutable</key><string>ionhf</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${NUMERIC}</string>
            <key>CFBundleVersion</key><string>${NUMERIC}</string>
            <key>CFBundleIconFile</key><string>ion</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Ion HF listens to your radio's receive audio.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          cp packaging/README.txt LICENSE NOTICE dist/root/
          ln -s /Applications dist/root/Applications
          hdiutil create -volname "Ion HF" -srcfolder dist/root -ov -format UDZO "dist/$NAME.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/${{ env.NAME }}.dmg

  linux:
    needs: version
    # The oldest supported runner, so the binary and the .deb run on older
    # glibc too (Debian 12, Ubuntu 22.04 and later).
    runs-on: ubuntu-22.04
    env:
      NAME: IonHF-${{ needs.version.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test -p ion --release --lib
      - run: cargo build -p ionhf --release
      - name: Tarball
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/ionhf packaging/README.txt LICENSE NOTICE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - name: Debian package
        run: |
          cargo deb -p ionhf --no-build --output dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/*.deb

  publish:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        run: |
          PRE=()
          [[ "$VERSION" == *-* ]] && PRE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ion HF $VERSION" \
            --notes-file packaging/release-notes.md \
            "${PRE[@]}"
